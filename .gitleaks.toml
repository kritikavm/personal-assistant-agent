# Secret scanning config (S-12). Run by the pre-commit and pre-push hooks in .githooks/.
title = "personal-assistant-agent"

[extend]
useDefault = true

# Google OAuth client secrets and refresh tokens, in addition to the default rules.
[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''GOCSPX-[A-Za-z0-9_\-]{20,}'''
keywords = ["gocspx"]

[[rules]]
id = "google-refresh-token"
description = "Google OAuth refresh token"
regex = '''1//0[A-Za-z0-9_\-]{30,}'''
keywords = ["1//0"]
