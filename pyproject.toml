[project]
name = "assistant"
version = "0.1.0"
description = "Local personal assistant agent: read-only Google Calendar, local tasks, Apple Reminders (Phase 1)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.168",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "keyring>=25.7.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
assistant = "assistant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests and evals import tests.fakes

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
]
